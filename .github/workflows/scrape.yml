name: Scrape

on:
  workflow_dispatch:
  schedule:
  # Daily at 22:22 GMT
  - cron: '21 22 * * *'

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
    - name: Get the code
      uses: actions/checkout@v4
    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        # Cache uv's package/build cache and the managed Python install
        enable-cache: true
        cache-python: true
        cache-dependency-glob: |
          pyproject.toml
          uv.lock
          .python-version
    - name: Cache the virtual environment
      uses: actions/cache@v6
      with:
        path: .venv
        key: venv-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pyproject.toml', 'uv.lock', '.python-version') }}
    - name: Install dependencies
      run: uv sync --locked
    - name: Run the scraper
      run: uv run main.py download-maxjeune
    - name: Update readme
      run: uv run main.py update-readme
    - name: Commit and push
      run: |-
        git config user.name "Automated"
        git config user.email "actions@users.noreply.github.com"
        git add -A
        timestamp=$(date -u)
        git commit -m "${timestamp}" || exit 0
        git pull --rebase
        git push
